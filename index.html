<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 パチ屋換金率＆景品計算ナビ</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2f;
            --accent-gold: #f59e0b;
            --accent-blue: #00f0ff;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #263353;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        header {
            text-align: center;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--accent-gold);
            letter-spacing: 0.05em;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
        }

        .card {
            background: linear-gradient(145deg, var(--card-bg), #111726);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 0.03em;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
        }

        .quick-btns {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 6px;
        }

        .q-btn {
            background-color: #1e293b;
            color: var(--accent-blue);
            border: 1px solid var(--border-color);
            padding: 6px 2px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .q-btn:active {
            background-color: var(--accent-blue);
            color: #000;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            background-color: #263353;
            color: var(--text-main);
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #00f0ff);
            color: #0b0f19;
            box-shadow: 0 2px 10px rgba(0, 240, 255, 0.3);
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .result-main {
            text-align: center;
            padding: 8px 0 12px;
            border-bottom: 1px dashed var(--border-color);
        }

        .result-label {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .result-val {
            font-size: 2.3rem;
            font-weight: bold;
            color: var(--accent-gold);
            margin: 2px 0;
            text-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
        }

        .prize-breakdown {
            display: flex;
            justify-content: space-around;
            margin: 12px 0;
            background-color: #0b0f19;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .prize-item {
            text-align: center;
        }

        .prize-count {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .prize-name {
            font-size: 0.65rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .advice-box {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(0, 240, 255, 0.05));
            border: 1px solid var(--accent-green);
            color: #34d399;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            text-align: center;
            font-weight: bold;
        }

        .custom-prize-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .store-select-box {
            border: 1px solid rgba(245, 158, 11, 0.4);
            background: linear-gradient(145deg, #181d2f, #121826);
        }
    </style>
</head>
<body>

    <header>
        <h1>🎰 換金率＆景品計算ナビ</h1>
    </header>

    <!-- マイ店舗切替 -->
    <div class="card store-select-box">
        <div class="card-title" style="color: var(--accent-gold);">🏪 店舗設定の切替</div>
        <div class="input-group">
            <label>保存済み店舗から選ぶ</label>
            <select id="store-select"></select>
        </div>
    </div>

    <!-- 獲得数・投資入力 -->
    <div class="card">
        <div class="card-title">① 出玉・収支入力</div>
        <div class="input-group">
            <label id="input-label">獲得枚数 (枚)</label>
            <input type="number" id="count-input" placeholder="例: 1250" inputmode="numeric">
            <div class="quick-btns">
                <button class="q-btn" onclick="addCount(100)">+100</button>
                <button class="q-btn" onclick="addCount(500)">+500</button>
                <button class="q-btn" onclick="addCount(1000)">+1000</button>
                <button class="q-btn" onclick="addCount(-100)">-100</button>
            </div>
        </div>
        <div class="input-group" style="margin-top: 10px;">
            <label>投資額 (円)</label>
            <input type="number" id="investment-input" placeholder="例: 10000" inputmode="numeric">
            <div class="quick-btns">
                <button class="q-btn" onclick="addInvest(1000)">+1千</button>
                <button class="q-btn" onclick="addInvest(5000)">+5千</button>
                <button class="q-btn" onclick="addInvest(10000)">+1万</button>
                <button class="q-btn" onclick="clearInvest()">リセット</button>
            </div>
        </div>
    </div>

    <!-- 結果表示 -->
    <div class="card">
        <div class="card-title">② 計算結果</div>
        <div class="result-main">
            <div class="result-label">換金予定額</div>
            <div class="result-val" id="exchange-total">¥0</div>
            <div class="result-label" id="profit-loss">差引収支: ±¥0</div>
        </div>

        <div class="prize-breakdown">
            <div class="prize-item">
                <div class="prize-count" id="count-large">0</div>
                <div class="prize-name" id="label-large">大景品</div>
            </div>
            <div class="prize-item">
                <div class="prize-count" id="count-medium">0</div>
                <div class="prize-name" id="label-medium">中景品</div>
            </div>
            <div class="prize-item">
                <div class="prize-count" id="count-small">0</div>
                <div class="prize-name" id="label-small">小景品</div>
            </div>
            <div class="prize-item">
                <div class="prize-count" id="count-rest">0</div>
                <div class="prize-name">余り</div>
            </div>
        </div>

        <div class="advice-box" id="advice-text">
            数値を入力すると計算結果が表示されます
        </div>
    </div>

    <!-- ホール・景品設定 -->
    <div class="card">
        <div class="card-title">⚙️ 現在の店舗設定・保存</div>
        
        <div class="input-group">
            <label>設定名（店舗名など）</label>
            <input type="text" id="store-name" value="マイホA (46スロ)">
        </div>

        <div class="input-group" style="margin-top: 8px;">
            <label>種別</label>
            <select id="type-select">
                <option value="slot">パチスロ (枚)</option>
                <option value="pachi">パチンコ (玉)</option>
            </select>
        </div>

        <div class="input-group">
            <label>貸出レート (1,000円あたりの枚数/玉数)</label>
            <input type="number" id="rent-rate" value="46">
        </div>

        <div class="input-group">
            <label>交換レート (100円に必要な枚数/玉数)</label>
            <input type="number" id="exchange-rate" value="5.1" step="0.1">
        </div>

        <div class="card-title" style="margin-top: 14px; margin-bottom: 6px;">特殊景品の設定</div>
        <div class="custom-prize-grid">
            <div class="input-group">
                <label>大景品 (円)</label>
                <input type="number" id="val-large" value="5000">
            </div>
            <div class="input-group">
                <label>必要数 (枚/玉)</label>
                <input type="number" id="req-large" value="253">
            </div>
            <div class="input-group">
                <label>中景品 (円)</label>
                <input type="number" id="val-medium" value="1000
